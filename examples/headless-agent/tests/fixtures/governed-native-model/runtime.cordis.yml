- id: llm-deepseek
  disabled: true

- id: tools
  config:
    mode: native

- id: sdk-jsonrpc-server
  inject: [sdkAppStartup, loader, governedNativeModelReady]

- insert:
    - id: native-model-checkpoint
      name: '@deepseek-ai/dsh-session-checkpoint-policy'
    - id: native-model-credentials
      name: '@deepseek-ai/dsh-credentials-local'
      config:
        path: !!js process.cwd() + '/.native-credentials.yaml'
        watch: false
    - id: native-model-web
      name: '@deepseek-ai/dsh-web'
    - id: native-model-search
      name: '@deepseek-ai/dsh-web-search-deepseek'
      config:
        provider: deepseek-official
        model: deepseek-v4-flash
        maxTokens: 64
        maxUses: 2
    - id: native-model-tool
      name: '@deepseek-ai/dsh-tool-web'
      config:
        fetch: false
    - id: native-model-fixture
      name: './plugin.mjs'
