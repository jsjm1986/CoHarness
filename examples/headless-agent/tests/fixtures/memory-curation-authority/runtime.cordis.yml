- id: llm-deepseek
  disabled: true
- id: sdk-jsonrpc-server
  inject: [sdkAppStartup, loader, memoryAuthorityFixtureReady]
- insert:
    - id: authority-storage
      name: '@deepseek-ai/dsh-storage'
    - id: authority-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js process.cwd() + '/.memory-store'
    - id: authority-domains
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json
    - id: memory
      name: '@deepseek-ai/dsh-memory'
      config:
        space: project
        extraction: !!js "process.env.DSH_MEMORY_AUTHORITY_KIND === 'extraction'"
        consolidation: !!js "process.env.DSH_MEMORY_AUTHORITY_KIND === 'consolidation'"
        recall: false
    - id: tool-memory
      name: '@deepseek-ai/dsh-tool-memory'
    - id: memory-curation
      name: '@deepseek-ai/dsh-memory-curation'
      config:
        consolidationMinChanges: 1
    - id: memory-authority-model
      name: './model.mjs'
