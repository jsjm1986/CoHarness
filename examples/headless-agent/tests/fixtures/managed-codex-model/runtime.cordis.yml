- id: llm-deepseek
  disabled: true
- id: tools
  config:
    mode: native
- id: sdk-jsonrpc-server
  inject: [sdkAppStartup, loader, managedCodexModelReady]
- insert:
    - id: managed-codex-checkpoint
      name: '@deepseek-ai/dsh-session-checkpoint-policy'
    - id: managed-codex-subagents
      name: '@deepseek-ai/dsh-subagent'
    - id: managed-codex-tool
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: owned-codex
        toolName: managed_codex
        backgroundMode: one-shot
        maxDepth: provider-managed
    - id: managed-codex-fixture
      name: './plugin.mjs'
      config:
        probeModelBodyDeadline: true
