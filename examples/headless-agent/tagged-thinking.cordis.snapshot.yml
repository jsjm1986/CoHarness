# Keyless assembled-app composition for an OpenAI-compatible gateway that
# places reasoning in ordinary streamed `delta.content`.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: tagged-gateway
              model: tagged-model
              cwd: !!js process.cwd()
          workspaceContext: false
          skills:
            enabled: false
          toolBash: false
          toolJobs: false
          goals: false
          includeRuntimeContext: false
          persona: 'Keyless tagged-thinking compatibility snapshot.'
      - id: persistence
        name: '@deepseek-ai/dsh-session-persistence-jsonl'
        config:
          root: './.sessions'
          compression: none
      - insert:
          - id: llm-pi-ai
            name: '@deepseek-ai/dsh-llm-pi-ai'
            config:
              providers:
                tagged-gateway:
                  apiKeyEnv: TAGGED_THINKING_KEY
                  api: openai-completions
                  baseURL: !!js process.env.DSH_TAGGED_THINKING_BASE_URL
                  models:
                    - id: tagged-model
                      name: Tagged model
                      contextWindow: 4096
                      maxTokens: 128
