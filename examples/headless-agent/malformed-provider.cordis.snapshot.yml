# Keyless assembled-app composition for an OpenAI-compatible relay whose root
# prefix returns HTML and whose `/v1` prefix serves the streaming API response.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: html-gateway
              model: html-model
              cwd: !!js process.cwd()
          workspaceContext: false
          skills:
            enabled: false
          toolBash: false
          toolJobs: false
          goals: false
          includeRuntimeContext: false
          persona: 'Keyless endpoint compatibility response snapshot.'
      - id: persistence
        name: '@deepseek-ai/dsh-session-persistence-jsonl'
        config:
          root: './.sessions'
          compression: none
      - insert:
          - id: llm-pi-ai
            name: '@deepseek-ai/dsh-llm-pi-ai'
            config:
              providers:
                html-gateway:
                  apiKeyEnv: HTML_GATEWAY_KEY
                  api: openai-completions
                  baseURL: !!js process.env.DSH_HTML_GATEWAY_BASE_URL
                  models:
                    - id: html-model
                      name: HTML gateway model
                      contextWindow: 4096
                      maxTokens: 128
