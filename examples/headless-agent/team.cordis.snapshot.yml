# Keyless Agent Teams composition over the real headless app and deterministic fixture adapter.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek-api-key'
        disabled: true
      - insert:
          - id: agent-team
            name: '@deepseek-ai/dsh-experimental-agent-team'
          - id: tool-agent-team
            name: '@deepseek-ai/dsh-experimental-tool-agent-team'
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
          - id: team-fixture-llm
            name: './tests/fixtures/team-llm.mjs'
          - id: enable-team-fixture
            name: '../../packages/experimental/agent-team/tests/enable-team-fixture.ts'
