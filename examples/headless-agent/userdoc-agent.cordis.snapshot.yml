# Keyless replay composition for the model-facing personal-document tools.
# The base creates the normal headless agent; this overlay adds the local
# personal document store, the model-facing Consumer, and deterministic replay.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: userdoc-local
            name: '@deepseek-ai/dsh-userdoc-local'
            config:
              uploadRoot: !!js "process.cwd() + '/uploads'"
          - id: tool-userdoc
            name: '@deepseek-ai/dsh-tool-userdoc'
            config:
              maxListResults: 10
              maxReadBytes: 4096
              maxReadLines: 100
              maxOutputBytes: 16384
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
