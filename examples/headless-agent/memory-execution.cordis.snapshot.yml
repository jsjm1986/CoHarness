- id: memory-execution-model
  name: './tests/fixtures/memory-execution-model.ts'

- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: bash
        name: '@deepseek-ai/dsh-bash-local'
        disabled: true
      - id: sandbox-policy
        name: '@deepseek-ai/dsh-sandbox-policy'
        config:
          mode: workspace-write
          workspaceRoot: !!js process.cwd()
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek-api-key'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: memory-execution
              model: memory-execution
              cwd: !!js process.cwd()
          workspaceContext: false
          dshHome: './.dsh-home'
          skills:
            filesystem:
              agentsHome: './.agents-home'
          persona: 'Keyless participant memory review.'
      - id: persistence
        name: '@deepseek-ai/dsh-session-persistence-jsonl'
        config:
          root: './.sessions'
      - insert:
          # Host plane: JSON per-record backend + domain + the durable service;
          # the store lives under the scenario workspace so the test inspects it.
          - id: storage
            name: '@deepseek-ai/dsh-storage'
          - id: storage-json
            name: '@deepseek-ai/dsh-storage-json'
            config:
              root: !!js process.cwd() + '/.memory-store'
          - id: storage-domain
            name: '@deepseek-ai/dsh-storage-domain'
            config:
              backend: json
          - id: memory
            name: '@deepseek-ai/dsh-memory'
            config:
              space: project
              extraction: true

          # Agent plane: the catalog listener, the four model-facing tools,
          # and the opt-in post-turn curation passes.
          - id: memory-context
            name: '@deepseek-ai/dsh-memory-context'
          - id: tool-memory
            name: '@deepseek-ai/dsh-tool-memory'
          - id: memory-curation
            name: '@deepseek-ai/dsh-memory-curation'
            config:
              extractionMaxWrites: 1
          - id: permission-presets
            name: '@deepseek-ai/dsh-permission-presets'
            config:
              defaultPreset: workspace-write
          - id: approval
            name: '@deepseek-ai/dsh-user-approval'
          - id: bash-sandbox
            name: '@deepseek-ai/dsh-bash-sandbox'
          - id: session-query
            name: '@deepseek-ai/dsh-session-query-sqlite'
            config:
              path: ':memory:'
              openAt: never
