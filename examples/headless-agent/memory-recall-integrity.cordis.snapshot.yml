- id: recall-integrity-model
  name: './tests/fixtures/memory-recall-integrity-model.ts'

- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek-api-key'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: recall-integrity
              model: recall-integrity
              cwd: !!js process.cwd()
          workspaceContext: false
          dshHome: './.dsh-home'
          skills:
            filesystem:
              agentsHome: './.agents-home'
          persona: 'Keyless bounded memory recall.'
      - id: persistence
        name: '@deepseek-ai/dsh-session-persistence-jsonl'
        config:
          root: './.sessions'
      - insert:
          # Host plane: JSON per-record backend + domain + the durable service;
          # the store lives under the scenario workspace so the test inspects it.
          - id: storage
            name: '@deepseek-ai/dsh-storage'
          - id: storage-json
            name: '@deepseek-ai/dsh-storage-json'
            config:
              root: !!js process.cwd() + '/.memory-store'
          - id: storage-domain
            name: '@deepseek-ai/dsh-storage-domain'
            config:
              backend: json
          - id: memory
            name: '@deepseek-ai/dsh-memory'
            config:
              space: personal
              recall: true

          # Recall and tool reads share the same durable memory service.
          - id: memory-context
            name: '@deepseek-ai/dsh-memory-context'
            config:
              recallInputMaxBytes: 256
              recallEntryMaxBytes: 64
              recallMaxBytes: 360
          - id: tool-memory
            name: '@deepseek-ai/dsh-tool-memory'
