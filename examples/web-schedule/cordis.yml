# Opt-in Schedule patch over the shipped Web composition. Tasks persist in the
# Host `schedule` storage domain and due occurrences resolve the original
# Session through the shared session controller.

- insert:
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'

    - id: schedule
      name: '@deepseek-ai/dsh-schedule'


- id: ui-schedule
  disabled: false
