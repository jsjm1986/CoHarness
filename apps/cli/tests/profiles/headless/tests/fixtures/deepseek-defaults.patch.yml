# Local endpoint and isolated-path patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  config:
    baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
    thinking: enabled
    reasoningEffort: low
    streamIdleTimeoutMs: 150

- id: agent-loop
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()

- id: agent-instructions
  disabled: true

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

# Replaces the disabled invocation provider so injected `headlessStartup` reads resolve.
- insert:
    - id: headless-startup-test-stub
      name: '../../../../../../../packages/test-support/loader-smoke/tests/fixtures/headless-startup-stub.ts'
