# Experimental Schedule over the shipped Web composition, which carries none of
# the host rows and parks `ui-schedule` disabled. The Schedule service owns the
# task store and delivers each due occurrence as a follow-up in its original
# Session; `time-context` supplies the current time, browser zone, and elapsed
# time the model needs to resolve an unqualified date or time; `ui-schedule` is
# the task page and the Session reminder catalog over that service.

- insert:
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'

    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

- id: ui-schedule
  disabled: false
