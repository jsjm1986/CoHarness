# Experimental persistent terminals over the shipped Web composition, which
# carries no host terminal rows (the minimal preset and sdk-minimal own their
# own entry-local `terminals` groups instead). The isolated group registers an
# entry-local terminal registry with the platform shell backend and publishes
# the six `terminal_*` tools on the global tool layer; terminals remain
# Agent-owned.

- insert:
    - id: optional-persistent-terminals
      name: cordis:group
      group: true
      isolate:
        terminals: true
      config:
        - id: optional-terminal-registry
          name: '@deepseek-ai/dsh-terminal'
        - id: optional-terminal-bash
          name: '@deepseek-ai/dsh-terminal-bash'
          disabled: !!js process.platform === 'win32'
        - id: optional-terminal-pwsh
          name: '@deepseek-ai/dsh-terminal-bash'
          disabled: !!js process.platform !== 'win32'
          config:
            shellDialect: pwsh
        - id: optional-tool-terminal
          name: '@deepseek-ai/dsh-tool-terminal'
