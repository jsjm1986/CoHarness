# Experimental Agent Teams profile layer. Apply after dsh-base so the shared
# task board composes with the shipped subagent delegation and control tools:
# teammates are named continuable subagent children, peer messaging rides
# send_message, and the four team_task_* tools appear once Team mode is on.

- insert:
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'

    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'

    - id: ui-agent-team
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'
