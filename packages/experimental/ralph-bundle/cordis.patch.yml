# Experimental Ralph loops over the shipped composition, which parks a Host
# `tool-ralph` row disabled (and, on Web, moves the `workflowEngine` service to
# per-preset realms). The bundle leaves both parked rows alone and inserts its
# own isolated group: a private workflow engine plus the model-facing tool,
# so the feature composes identically on every profile layer list.

- insert:
    - id: optional-ralph
      name: cordis:group
      group: true
      isolate:
        workflowEngine: true
      config:
        - id: optional-ralph-workflow
          name: '@deepseek-ai/dsh-workflow-ptc'
          config:
            provider: spawn
        - id: tool-ralph
          name: '@deepseek-ai/dsh-tool-ralph'
          config:
            subagentProvider: spawn
            maxRounds: 64
