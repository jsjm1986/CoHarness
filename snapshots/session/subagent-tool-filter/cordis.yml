# The parent owns its file and web tools; the child selects a separate preset.
- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-web
  disabled: true

- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: parent
    - id: parent-agent-preset
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/parent-agent-preset.ts'

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  inject: [agentPresets]
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    maxDepth: 1
    agentPreset: child
