# Runtime-context suppression overlay over the default headless composition:
# optional dynamic context (including the delegation-depth hint) stays out of
# the model history while the provider still enforces the root depth cap.
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeRuntimeContext: false
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    maxDepth: 0
