# Build and publish the @deepseek-ai/node-addon-landlock-run package family from the
# harness source of record. Rehearsal and publication consume the same packed
# tarballs; each native binary is built on its matching architecture.
name: Node Addon System Release

on:
  workflow_dispatch:
    inputs:
      evidence_runs:
        description: Comma-separated completed CI run IDs for this exact candidate. Required to publish.
        required: false
        type: string
      publish:
        description: Publish packed tarballs to npm. Must run from a node-addon-system-v* tag.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  # Stable/prerelease dist-tags are shared registry state; serialize release
  # runs so two versions cannot race the final tag assignment.
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DSH_RELEASE_READINESS: .artifacts/release-evidence/readiness.json
  DSH_RELEASE_EVIDENCE_RUNS: ${{ inputs.evidence_runs }}

defaults:
  run:
    working-directory: native/system

jobs:
  matrix:
    name: Matrix
    runs-on: ubuntu-24.04
    outputs:
      prebuilds: ${{ steps.matrix.outputs.prebuilds }}
    steps:
      - uses: actions/checkout@v7

      - id: matrix
        run: echo "prebuilds=$(node ./scripts/github-matrix.mjs release-prebuild)" >> "$GITHUB_OUTPUT"

  build-prebuilds:
    name: ${{ matrix.package }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.prebuilds) }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --filter @deepseek-ai/node-addon-system-workspace... --frozen-lockfile

      - name: Install musl toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq musl-tools

      - name: Build native binaries
        run: pnpm build:native

      - name: Verify binary metadata
        run: node ./scripts/verify-launcher-binary.mjs ${{ matrix.dir }}

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: native/system/${{ matrix.dir }}/bin/*
          if-no-files-found: error
          retention-days: 7

  pack:
    name: Pack npm tarballs
    needs: build-prebuilds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --filter @deepseek-ai/node-addon-system-workspace... --frozen-lockfile

      - name: Install readiness tooling
        working-directory: .
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify source readiness
        if: inputs.publish
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm run release:prepare --family native --version "$(node -p 'require("./native/system/package.json").version')"

      - name: Build TypeScript
        run: pnpm build:ts

      - name: Verify release version
        run: node ./scripts/verify-release.mjs
        env:
          RELEASE_PUBLISH: ${{ inputs.publish }}

      - name: Download prebuild artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: prebuild-*
          path: native/system/.release/prebuild-artifacts

      - name: Assemble and verify prebuilds
        run: node ./scripts/assemble-prebuilds.mjs .release/prebuild-artifacts

      - name: Verify release payload
        run: node ./scripts/verify-release.mjs --prebuilds
        env:
          RELEASE_PUBLISH: ${{ inputs.publish }}

      - name: Pack release tarballs
        run: node ./scripts/pack-release.mjs dist/npm

      - name: Verify packed install
        run: node ./scripts/verify-packed-install.mjs dist/npm
        env:
          NALR_REQUIRE_LANDLOCK: 1

      - name: Record installed native tarball evidence
        uses: ./.github/actions/gate-evidence
        env:
          DSH_GATE_REPORT_DIR: .artifacts/gates
          DSH_EVIDENCE_ARTIFACT_NAME: gate-evidence-native-pack-${{ github.run_attempt }}
          DSH_EVIDENCE_JOB_NAME: Pack npm tarballs
          DSH_BUILD_CLIENT_PROFILE: official
          DSH_GATE_ARTIFACT_GLOBS: '["native/system/dist/npm/*.tgz"]'
        with:
          external: native-pack
          status: ${{ job.status }}
          command: node native/system/scripts/verify-packed-install.mjs

      - name: Upload npm tarballs
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarballs
          path: native/system/dist/npm/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    if: inputs.publish
    needs: pack
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      # The publisher consumes the pack job bytes and revalidates their evidence.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@v6.0.10
      - name: Install readiness tooling
        working-directory: .
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download npm tarballs
        uses: actions/download-artifact@v8
        with:
          name: npm-tarballs
          path: native/system/dist/npm

      - name: Verify publication readiness
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm run release:prepare --family native --version "$(node -p 'require("./native/system/package.json").version')" --phase publish

      - name: Configure npm token fallback
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NPM_TOKEN" ]]; then
            echo "NODE_AUTH_TOKEN=$NPM_TOKEN" >> "$GITHUB_ENV"
          fi

      - name: Publish tarballs
        # Publication is decided per package against the registry, so re-running
        # this job over the same artifact skips what already landed instead of
        # failing on it. A bare `npm publish` loop could not be retried: the
        # registry answers a repeat of an existing version permanently.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ./scripts/publish-release.mjs dist/npm
