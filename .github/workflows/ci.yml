name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Nightly native-Windows sweep. The platform inventory moved off the pull
  # request path, so this guarantees it still runs when master is quiet. The
  # minute is offset from the hour because GitHub queues the top-of-hour load.
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Manual CI suite to run
        required: true
        default: larger-runner-benchmark
        type: choice
        options:
          - larger-runner-benchmark
          - consolidated-runner-benchmark
          - full-audit
          - android-audit

# Cancel a superseded run on every event EXCEPT push. A deployment may enable
# the two self-hosted standby drills; they can take longer than the interval
# between master merges, so cancelling supersedes a drill before it reaches a
# verdict and the lane yields no readiness evidence. Must be decided here:
# cancellation applies
# to the whole superseded run, so a job-level group cannot exempt its job.
# Negated rather than `== 'pull_request'` so workflow_dispatch keeps cancelling:
# a re-dispatched runner benchmark holds up to 12 larger runners for 15 minutes
# and shares this group with the drills on master, so queueing it would delay
# them. The guarantee is narrow — evaluated against the newly triggered run, so a
# dispatch on master still cancels a mid-flight drill, and a newer pending push
# displaces an older one. Bounds and rationale:
# .agents/notes/implemented/process/2026-07-26-ci-failover-runbook.md
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  DSH_GATE_REPORT_DIR: .artifacts/gates
  PRIMARY_NODE_VERSION: '24'
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:

  # TODO(hosted-serial-ci): Re-enable the one remaining disabled hosted serial
  # reference job (serial-macos) before release. The self-hosted standby lanes
  # below require DSH_CI_SELF_HOSTED_STANDBY_ENABLED=true. The master release
  # pack owns the Linux dependency cache; browser sweep owns Chromium's cache.

  # Pull-request changes that only update workflow action pins or documentation
  # do not need the release-sized coverage, browser, runtime, and native lanes.
  # Source and dependency changes keep the complete existing PR gate set.
  pr-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: PR scope / lane selection
    outputs:
      run_expensive: ${{ steps.scope.outputs.run_expensive }}
      reason: ${{ steps.scope.outputs.reason }}
      changed_source_files: ${{ steps.scope.outputs.changed_source_files }}
      changed_package_files: ${{ steps.scope.outputs.changed_package_files }}
      changed_docs_only: ${{ steps.scope.outputs.changed_docs_only }}
      coverage_mode: ${{ steps.scope.outputs.coverage_mode }}
      snapshot_mode: ${{ steps.scope.outputs.snapshot_mode }}
      web_groups: ${{ steps.scope.outputs.web_groups }}
      web_scenarios: ${{ steps.scope.outputs.web_scenarios }}
      compat_mode: ${{ steps.scope.outputs.compat_mode }}
      python_mode: ${{ steps.scope.outputs.python_mode }}
      windows_mode: ${{ steps.scope.outputs.windows_mode }}
      gateway_mode: ${{ steps.scope.outputs.gateway_mode }}
      admin_ui_mode: ${{ steps.scope.outputs.admin_ui_mode }}
      android_mode: ${{ steps.scope.outputs.android_mode }}
      scoped_packages: ${{ steps.scope.outputs.scoped_packages }}
      validation_plan: ${{ steps.scope.outputs.validation_plan }}
      proof_release_pack: ${{ steps.scope.outputs.proof_release_pack }}
      proof_vendor_pack: ${{ steps.scope.outputs.proof_vendor_pack }}
      proof_native_pack: ${{ steps.scope.outputs.proof_native_pack }}
      proof_sandbox: ${{ steps.scope.outputs.proof_sandbox }}
      proof_provider: ${{ steps.scope.outputs.proof_provider }}
      proof_pi_ai: ${{ steps.scope.outputs.proof_pi_ai }}
      proof_native_windows: ${{ steps.scope.outputs.proof_native_windows }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install scope classifier runtime
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Classify pull-request scope
        id: scope
        env:
          # GitHub withholds repo secrets from fork and Dependabot events, so
          # credential-bound proofs can never satisfy their required result on
          # those PRs; record them withheld instead of selecting doomed lanes.
          DSH_CI_UNTRUSTED_ACTOR: ${{ github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: pnpm exec tsx scripts/ci-pr-scope.ts "${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"

      - name: Summarize golden changes and replay status
        if: always()
        env:
          DSH_GOLDEN_BASE: ${{ github.event.pull_request.base.sha }}
          DSH_GOLDEN_REPLAY: pending
        run: pnpm run summarize:expected --base "$DSH_GOLDEN_BASE" --replay "$DSH_GOLDEN_REPLAY"

      - name: Preserve selection comparison
        uses: actions/upload-artifact@v7
        with:
          name: gate-evidence-pr-scope-${{ github.run_attempt }}
          path: .artifacts/gates/selection-*.json
          include-hidden-files: true
          if-no-files-found: error

  # Three jobs isolate coverage, static analysis, and the build-backed consumer
  # tail. The portable default uses standard GitHub-hosted capacity. Deployments
  # with the named enterprise pools may set DSH_CI_ENTERPRISE_RUNNERS_ENABLED to
  # exactly `true`; the existing platform failover switches still take priority.
  # The consumer job owns the only Linux build, so all three jobs enter runner
  # allocation independently.
  #
  # FAILOVER (Linux): each Linux worker resolves its pool through the
  # DSH_CI_FAILOVER_LINUX repository variable. Setting the variable to
  # `selfhosted` (repo Settings → Actions → Variables; writer-manageable
  # repository state — not PR-editable, no merge required) retargets trusted,
  # same-repository PRs onto the in-house
  # vm-backup pool and re-running the failed jobs is the entire switch —
  # see .agents/notes/implemented/process/2026-07-26-ci-failover-runbook.md. The
  # in-house pool's readiness can be re-proven on master pushes by explicitly
  # enabling the serial-linux-selfhosted standby lane below. The Windows
  # failover switch is the separate DSH_CI_FAILOVER_WINDOWS variable on the
  # windows-native job below.
  node-24:
    if: github.event_name == 'pull_request'
    runs-on: >-
      ${{ vars.DSH_CI_FAILOVER_LINUX == 'selfhosted'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && fromJSON('["self-hosted", "linux", "x64", "vm-backup"]')
          || vars.DSH_CI_ENTERPRISE_RUNNERS_ENABLED == 'true'
          && 'dsh-ubuntu-24-04-16core'
          || 'ubuntu-latest' }}
    name: node 24 / static
    env:
      DSH_EVIDENCE_JOB_NAME: "node 24 / static"
      DSH_EVIDENCE_ARTIFACT_NAME: gate-evidence-node-24-${{ github.run_attempt }}
      DSH_GATE_CONCURRENCY: >-
        ${{ ((vars.DSH_CI_FAILOVER_LINUX == 'selfhosted'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]')
          || vars.DSH_CI_ENTERPRISE_RUNNERS_ENABLED == 'true')
          && '8' || '2' }}
    steps:
      # Fetch complete history so the archive gate can read the trusted PR base from a reused shallow checkout.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      # Pull requests consume the default-branch cache but do not put cache
      # compression and upload on the paid latency-critical path. Skipped
      # under failover — see the coverage lane's identical rationale.
      - uses: actions/cache/restore@v4
        if: >-
          vars.DSH_CI_FAILOVER_LINUX != 'selfhosted'
          || github.event.pull_request.head.repo.full_name != github.repository
          || github.event.pull_request.user.login == 'dependabot[bot]'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Fetch pinned public upstream inputs
        run: node scripts/fetch-upstream-baseline.ts

      - name: Run static gates
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm run check:ci:static
      - name: Preserve gate evidence
        if: always()
        uses: ./.github/actions/gate-evidence
        with:
          status: ${{ job.status }}

  node-24-coverage:
    needs: pr-scope
    if: github.event_name == 'pull_request' && needs.pr-scope.outputs.run_expensive == 'true'
    runs-on: >-
      ${{ vars.DSH_CI_FAILOVER_LINUX == 'selfhosted'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && fromJSON('["self-hosted", "linux", "x64", "vm-backup"]')
          || vars.DSH_CI_ENTERPRISE_RUNNERS_ENABLED == 'true'
          && 'dsh-ubuntu-24-04-16core'
          || 'ubuntu-latest' }}
    name: node 24 / coverage
    env:
      DSH_EVIDENCE_JOB_NAME: "node 24 / coverage"
      DSH_EVIDENCE_ARTIFACT_NAME: gate-evidence-node-24-coverage-${{ github.run_attempt }}
      # Partitioning replaces the instrumented share. Portable standard runners
      # use two single-worker partitions and one outer gate worker; configured
      # external pools retain their measured partition and gate bounds.
      DSH_COVERAGE_MAX_WORKERS: >-
        ${{ ((vars.DSH_CI_FAILOVER_LINUX == 'selfhosted'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]')
          || vars.DSH_CI_ENTERPRISE_RUNNERS_ENABLED == 'true')
          && '6' || '2' }}
      DSH_COVERAGE_PARTITIONS: >-
        ${{ ((vars.DSH_CI_FAILOVER_LINUX == 'selfhosted'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]')
          || vars.DSH_CI_ENTERPRISE_RUNNERS_ENABLED == 'true')
          && '4' || '2' }}
      DSH_COVERAGE_TEST_TIMEOUT_MS: '30000'
      DSH_COVERAGE_TIMING_PROFILE: >-
        ${{ vars.DSH_CI_FAILOVER_LINUX == 'selfhosted'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && 'selfhosted-vm-backup'
          || vars.DSH_CI_ENTERPRISE_RUNNERS_ENABLED == 'true'
          && 'dsh-ubuntu-24-04-16core' || 'github-ubuntu-standard' }}
      DSH_GATE_CONCURRENCY: >-
        ${{ ((vars.DSH_CI_FAILOVER_LINUX == 'selfhosted'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]')
          || vars.DSH_CI_ENTERPRISE_RUNNERS_ENABLED == 'true')
          && '3' || '1' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The scoped changed-source gate diffs against pr-scope's inferred
          # base commit; a depth-1 clone cannot resolve it.
          fetch-depth: 0
          # The upstream-sovereignty gate diffs packages against the mirrored
          # upstream release tag.
          fetch-tags: true

      - uses: pnpm/action-setup@v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      # Skipped under failover: the self-hosted VM's persistent pnpm store
      # already serves warm installs, while restoring the hosted archive
      # would spend ~52 s pulling ~180 MB into that populated store.
      - uses: actions/cache/restore@v4
        if: >-
          vars.DSH_CI_FAILOVER_LINUX != 'selfhosted'
          || github.event.pull_request.head.repo.full_name != github.repository
          || github.event.pull_request.user.login == 'dependabot[bot]'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install dependencies and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"

      - name: Resolve coverage timing identity
        if: needs.pr-scope.outputs.coverage_mode == 'full'
        id: coverage-timing
        run: node --import tsx/esm scripts/coverage-timing-key.ts >> "$GITHUB_OUTPUT"

      - name: Restore compatible scheduling weights
        if: needs.pr-scope.outputs.coverage_mode == 'full'
        uses: actions/cache/restore@v4
        with:
          path: .coverage-times.json
          key: ${{ steps.coverage-timing.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.coverage-timing.outputs.key }}-

      # Scoped PRs run only the changed packages' tests and then enforce the
      # per-file 100% gate over exactly the changed source files
      # (scripts/incremental-coverage.ts); full PRs keep the complete lane.
      - name: Run coverage (scoped or full)
        if: needs.pr-scope.outputs.coverage_mode == 'scoped'
        env:
          DSH_INCREMENTAL_BASE: ${{ github.event.pull_request.base.sha }}
          DSH_SCOPED_PACKAGES: ${{ needs.pr-scope.outputs.scoped_packages }}
        run: pnpm run check:ci:coverage:scoped
      - name: Run exhaustive coverage
        if: needs.pr-scope.outputs.coverage_mode != 'scoped'
        run: pnpm run check:ci:coverage
      - name: Save successful scheduling weights
        if: success() && needs.pr-scope.outputs.coverage_mode == 'full' && hashFiles('.coverage-times.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .coverage-times.json
          key: ${{ steps.coverage-timing.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve gate evidence
        if: always()
        uses: ./.github/actions/gate-evidence
        with:
          status: ${{ job.status }}

  node-24-bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    name: node 24 / benchmarks
    env:
      DSH_EVIDENCE_JOB_NAME: "node 24 / benchmarks"
      DSH_EVIDENCE_ARTIFACT_NAME: gate-evidence-node-24-bench-${{ github.run_attempt }}
    # Wall-clock budgets need an otherwise idle runner, so this job runs the
    # benchmark lane alone instead of joining a concurrent gate aggregate.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Install benchmark browser and hosted dependencies
        run: pnpm --filter @deepseek-ai/dsh-benchmarks exec playwright install --with-deps chromium

      - name: Run performance benchmarks
        env:
          DSH_GATE_VERBOSE: '1'
        run: pnpm run check:ci:bench

      - name: Preserve gate evidence
        if: always()
        uses: ./.github/actions/gate-evidence
        with:
          status: ${{ job.status }}

  node-24-consumers:
    needs: pr-scope
    if: github.event_name == 'pull_request' && needs.pr-scope.outputs.run_expensive == 'true'
    runs-on: >-
      ${{ vars.DSH_CI_FAILOVER_LINUX == 'selfhosted'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && fromJSON('["self-hosted", "linux", "x64", "vm-backup"]')
          || vars.DSH_CI_ENTERPRISE_RUNNERS_ENABLED == 'true'
          && 'dsh-ubuntu-24-04-16core'
          || 'ubuntu-latest' }}
    name: node 24 / snapshots and artifacts
    services:
      execution-postgres:
        image: ${{ needs.pr-scope.outputs.gateway_mode == 'full' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: hgw
          POSTGRES_PASSWORD: hgw
          POSTGRES_DB: hgw_execution
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U hgw -d hgw_execution"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DSH_EVIDENCE_JOB_NAME: "node 24 / snapshots and artifacts"
      DSH_EVIDENCE_ARTIFACT_NAME: gate-evidence-node-24-consumers-${{ github.run_attempt }}
      DSH_GATE_CONCURRENCY: >-
        ${{ ((vars.DSH_CI_FAILOVER_LINUX == 'selfhosted'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]')
          || vars.DSH_CI_ENTERPRISE_RUNNERS_ENABLED == 'true')
          && '8' || '1' }}
      DSH_NODE_COMPAT_SKIP_TYPECHECK: '1'
      DSH_OXLINT_THREADS: >-
        ${{ ((vars.DSH_CI_FAILOVER_LINUX == 'selfhosted'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]')
          || vars.DSH_CI_ENTERPRISE_RUNNERS_ENABLED == 'true')
          && '8' || '1' }}
      DSH_PUBLINT_CONCURRENCY: >-
        ${{ ((vars.DSH_CI_FAILOVER_LINUX == 'selfhosted'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]')
          || vars.DSH_CI_ENTERPRISE_RUNNERS_ENABLED == 'true')
          && '8' || '1' }}
      # Failover uses the shared-VM bound; enterprise keeps the measured larger
      # bound, while the portable standard pool serializes browser snapshots.
      DSH_SNAPSHOT_MAX_CONCURRENCY: >-
        ${{ vars.DSH_CI_FAILOVER_LINUX == 'selfhosted'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && '12'
          || vars.DSH_CI_ENTERPRISE_RUNNERS_ENABLED == 'true'
          && '32'
          || '1' }}
    steps:
      # The golden summary diffs the pull-request base against HEAD; a
      # depth-1 checkout lacks the merge-base object.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      # Pull requests read the store produced by the master release-pack job.
      # The persistent failover VM already owns a warm store.
      - uses: actions/cache/restore@v4
        if: >-
          vars.DSH_CI_FAILOVER_LINUX != 'selfhosted'
          || github.event.pull_request.head.repo.full_name != github.repository
          || github.event.pull_request.user.login == 'dependabot[bot]'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install dependencies and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"

      # Gateway is an independent npm project outside the root pnpm workspace.
      # Root snapshot tests import its runtime modules and the typed lint face
      # reads its dev-time @types (pg, better-sqlite3), so install the full
      # locked dependency graph before the consumer gate starts.
      - name: Install Gateway dependencies
        run: npm ci --prefix gateway

      - name: Test Gateway execution through Loader and PostgreSQL
        id: gateway-execution
        if: needs.pr-scope.outputs.gateway_mode == 'full'
        env:
          HGW_TEST_DATABASE_URL: postgres://hgw:hgw@127.0.0.1:${{ job.services.execution-postgres.ports['5432'] }}/hgw_execution
        run: pnpm run test:gateway:execution

      - name: Record Gateway execution evidence
        if: always() && needs.pr-scope.outputs.gateway_mode == 'full'
        env:
          EVIDENCE_CHECK: gateway-execution
          EVIDENCE_COMMAND: pnpm run test:gateway:execution
          EVIDENCE_STATUS: ${{ steps.gateway-execution.outcome == 'skipped' && 'cancelled' || steps.gateway-execution.outcome }}
        run: node scripts/gate-evidence.ts

      # The browser snapshot left this aggregate: the keyless consumer gates run
      # here for every snapshot mode, and the dedicated web-verification lane
      # below owns skip/focused/full browser verification.
      - name: Run keyless compatibility, snapshot, and artifact gates
        run: pnpm run check:ci:consumers:scoped
      - name: Summarize golden changes and replay status
        if: always()
        env:
          DSH_GOLDEN_BASE: ${{ github.event.pull_request.base.sha }}
          DSH_GOLDEN_REPLAY: ${{ job.status }}
        run: pnpm run summarize:expected --base "$DSH_GOLDEN_BASE" --replay "$DSH_GOLDEN_REPLAY"

      - name: Preserve gate evidence
        if: always()
        uses: ./.github/actions/gate-evidence
        with:
          status: ${{ job.status }}


  # The dedicated web browser verification lane. One stable check name lets
  # branch protection require it regardless of the tier; the selected tier and
  # groups go to the job summary. Skip and scoped modes record the selector's
  # reason and pass; focused replays the policy-selected business groups plus
  # the stable smoke set; full replays the complete inventory. The selector
  # lives in scripts/ci-pr-scope.ts over scripts/web-test-policy.json, and the
  # nightly/master sweep below still replays the whole inventory after every
  # merge.
  web-verification:
    if: github.event_name == 'pull_request'
    needs: pr-scope
    runs-on: >-
      ${{ vars.DSH_CI_FAILOVER_LINUX == 'selfhosted'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && fromJSON('["self-hosted", "linux", "x64", "vm-backup"]')
          || vars.DSH_CI_ENTERPRISE_RUNNERS_ENABLED == 'true'
          && 'dsh-ubuntu-24-04-16core'
          || 'ubuntu-latest' }}
    name: web verification
    timeout-minutes: 90
    env:
      DSH_EVIDENCE_JOB_NAME: "web verification"
      DSH_EVIDENCE_ARTIFACT_NAME: gate-evidence-web-verification-${{ github.run_attempt }}
      DSH_WEB_SNAPSHOT_WORKERS: >-
        ${{ ((vars.DSH_CI_FAILOVER_LINUX == 'selfhosted'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]')
          || vars.DSH_CI_ENTERPRISE_RUNNERS_ENABLED == 'true')
          && '6' || '1' }}
    steps:
      - name: Record skipped web verification
        if: needs.pr-scope.outputs.snapshot_mode == 'skip' || needs.pr-scope.outputs.snapshot_mode == 'scoped'
        run: |
          echo "Web browser verification skipped: snapshot_mode=${{ needs.pr-scope.outputs.snapshot_mode }}; no changed path can reach browser-rendered output." >> "$GITHUB_STEP_SUMMARY"

      - name: Record web verification tier
        if: needs.pr-scope.outputs.snapshot_mode == 'focused' || needs.pr-scope.outputs.snapshot_mode == 'full'
        run: |
          echo "Web browser verification: snapshot_mode=${{ needs.pr-scope.outputs.snapshot_mode }}; groups=${{ needs.pr-scope.outputs.web_groups || '(complete inventory)' }}" >> "$GITHUB_STEP_SUMMARY"

      # Every step below only runs when the selector chose a browser tier.
      # The golden summary diffs the pull-request base against HEAD; a
      # depth-1 checkout lacks the merge-base object.
      - uses: actions/checkout@v7
        if: needs.pr-scope.outputs.snapshot_mode == 'focused' || needs.pr-scope.outputs.snapshot_mode == 'full'
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.10
        if: needs.pr-scope.outputs.snapshot_mode == 'focused' || needs.pr-scope.outputs.snapshot_mode == 'full'
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7
        if: needs.pr-scope.outputs.snapshot_mode == 'focused' || needs.pr-scope.outputs.snapshot_mode == 'full'
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        if: needs.pr-scope.outputs.snapshot_mode == 'focused' || needs.pr-scope.outputs.snapshot_mode == 'full'
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      # Skipped under failover — the self-hosted VM's persistent store is
      # already warm (same rationale as the consumer job's restore).
      - uses: actions/cache/restore@v4
        if: >-
          (needs.pr-scope.outputs.snapshot_mode == 'focused' || needs.pr-scope.outputs.snapshot_mode == 'full')
          && (vars.DSH_CI_FAILOVER_LINUX != 'selfhosted'
          || github.event.pull_request.head.repo.full_name != github.repository
          || github.event.pull_request.user.login == 'dependabot[bot]')
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      # Skipped under failover: the VM's persistent browser cache is already warm.
      - uses: actions/cache/restore@v4
        if: >-
          (needs.pr-scope.outputs.snapshot_mode == 'focused' || needs.pr-scope.outputs.snapshot_mode == 'full')
          && (vars.DSH_CI_FAILOVER_LINUX != 'selfhosted'
          || github.event.pull_request.head.repo.full_name != github.repository
          || github.event.pull_request.user.login == 'dependabot[bot]')
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies and prepare bubblewrap
        if: needs.pr-scope.outputs.snapshot_mode == 'focused' || needs.pr-scope.outputs.snapshot_mode == 'full'
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"

      # Gateway is an independent npm project outside the root pnpm workspace.
      # Root web snapshot tests import its runtime modules.
      - name: Install Gateway runtime dependencies
        if: needs.pr-scope.outputs.snapshot_mode == 'focused' || needs.pr-scope.outputs.snapshot_mode == 'full'
        run: npm ci --prefix gateway

      - name: Install Admin browser dependencies
        if: needs.pr-scope.outputs.snapshot_mode == 'full' || (needs.pr-scope.outputs.snapshot_mode == 'focused' && contains(needs.pr-scope.outputs.web_groups, 'settings'))
        run: npm ci --prefix gateway/admin-ui

      - name: Install Playwright Chromium and hosted dependencies
        if: >-
          (needs.pr-scope.outputs.snapshot_mode == 'focused' || needs.pr-scope.outputs.snapshot_mode == 'full')
          && (vars.DSH_CI_FAILOVER_LINUX != 'selfhosted'
          || github.event.pull_request.head.repo.full_name != github.repository
          || github.event.pull_request.user.login == 'dependabot[bot]')
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium

      # The persistent VM image owns Playwright's Linux system packages; do
      # not mutate the shared host with apt on every failover run.
      - name: Install Playwright Chromium on the failover VM
        if: >-
          (needs.pr-scope.outputs.snapshot_mode == 'focused' || needs.pr-scope.outputs.snapshot_mode == 'full')
          && (vars.DSH_CI_FAILOVER_LINUX == 'selfhosted'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]')
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install chromium

      # Focused verification caps the pool at two workers: the selection is a
      # business group plus the smoke set, which parallelizes poorly past that.
      - name: Run focused web verification
        if: needs.pr-scope.outputs.snapshot_mode == 'focused'
        env:
          DSH_WEB_GROUPS: ${{ needs.pr-scope.outputs.web_groups }}
          DSH_WEB_SCENARIOS: ${{ needs.pr-scope.outputs.web_scenarios != '[]' && needs.pr-scope.outputs.web_scenarios || '' }}
          DSH_WEB_SNAPSHOT_WORKERS: '2'
        run: pnpm run check:ci:web:focused

      - name: Run full web verification
        if: needs.pr-scope.outputs.snapshot_mode == 'full'
        run: pnpm run check:ci:web:full
      - name: Summarize golden changes and replay status
        if: always() && (needs.pr-scope.outputs.snapshot_mode == 'focused' || needs.pr-scope.outputs.snapshot_mode == 'full')
        env:
          DSH_GOLDEN_BASE: ${{ github.event.pull_request.base.sha }}
          DSH_GOLDEN_REPLAY: ${{ job.status }}
        run: pnpm run summarize:expected --base "$DSH_GOLDEN_BASE" --replay "$DSH_GOLDEN_REPLAY"

      - name: Preserve gate evidence
        if: always() && (needs.pr-scope.outputs.snapshot_mode == 'focused' || needs.pr-scope.outputs.snapshot_mode == 'full')
        uses: ./.github/actions/gate-evidence
        with:
          status: ${{ job.status }}


  # The Gateway is an independent npm project, so the root Vitest inventory
  # cannot exercise its ACL, principal, and PostgreSQL-facing code. Run its
  # own package checks when the cloud control plane or its shared API seam can
  # change; ordinary package-only PRs do not pay for this installation.
  gateway:
    needs: pr-scope
    if: >-
      always() && ((github.event_name == 'workflow_dispatch' && inputs.suite == 'full-audit')
      || (github.event_name == 'pull_request' && needs.pr-scope.outputs.gateway_mode == 'full'))
    runs-on: ubuntu-latest
    name: gateway / typecheck and unit tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hgw
          POSTGRES_PASSWORD: hgw
          POSTGRES_DB: hgw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hgw -d hgw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DSH_EVIDENCE_JOB_NAME: "gateway / typecheck and unit tests"
      DSH_EVIDENCE_ARTIFACT_NAME: gate-evidence-gateway-${{ github.run_attempt }}
      HGW_TEST_DATABASE_URL: postgres://hgw:hgw@127.0.0.1:5432/hgw_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: Install Gateway dependencies
        run: npm ci --prefix gateway
      # The paths map keeps vendored packages on their emitted lib/types
      # (their source needs the loose vendored compiler flags) and
      # session-format on its emitted lib/types (its durable JSON index
      # signatures need exactOptionalPropertyTypes, which the gateway's
      # own source does not satisfy); emit those declarations with the
      # lane's own tsc instead of a workspace build a standalone npm-ci
      # checkout cannot produce. tsc resolves @types and bare specifiers
      # upward from each project, so expose the gateway install's type
      # packages and schema spec plus the vendored cosmokit on that walk.
      - name: Emit type declarations the Gateway paths consume
        run: |
          mkdir -p node_modules/@deepseek-ai
          ln -s ../gateway/node_modules/@types node_modules/@types
          ln -s ../gateway/node_modules/@standard-schema node_modules/@standard-schema
          ln -s ../gateway/node_modules/zod node_modules/zod
          ln -s ../../vendor/cosmokit node_modules/@deepseek-ai/cosmokit
          gateway/node_modules/.bin/tsc -b vendor/cordis vendor/schemastery vendor/cosmokit packages/session/session-format packages/session/session-format-catalog
      - name: Typecheck Gateway
        run: npm run typecheck --prefix gateway
      # The production `npm run build` resolves workspace packages through their
      # emitted lib/types, which a standalone npm-ci lane cannot produce; the
      # check variant compiles and emits the same source graph through the
      # tsconfig paths instead.
      - name: Build Gateway
        run: npm run build:check --prefix gateway
      # Gateway tests materialize the bundle into staged instance homes; the
      # ci face emits transpile-only because this lane has no workspace lib/types.
      - name: Build the directory guard bundle used by Gateway tests
        run: gateway/node_modules/.bin/tsc -p plugins/dsh-directory-guard/tsconfig.ci.json
      # loadConfig's source-run default resolves tsx/esm to an absolute path
      # under the repo root (instances spawn outside it); this lane has no root
      # install, so provide the root devDependency for the resolution test.
      - name: Install the repo-level tsx devDependency
        run: |
          npm install --prefix "$RUNNER_TEMP/harness-root-deps" --no-save --no-package-lock "tsx@$(node -p "require(process.cwd() + '/package.json').devDependencies.tsx")"
          mkdir -p node_modules && cp -R "$RUNNER_TEMP/harness-root-deps/node_modules/." node_modules/
      - name: Test Gateway
        run: npm test --prefix gateway
      - name: Test Gateway PostgreSQL authorization and invalidation
        run: npm run test:postgres --prefix gateway
      - name: Preserve gate evidence
        if: always()
        uses: ./.github/actions/gate-evidence
        with:
          status: ${{ job.status }}
          external: gateway
          command: npm test --prefix gateway && npm run test:postgres --prefix gateway

  gateway-admin-ui:
    needs: pr-scope
    if: >-
      always() && ((github.event_name == 'workflow_dispatch' && inputs.suite == 'full-audit')
      || (github.event_name == 'pull_request' && needs.pr-scope.outputs.admin_ui_mode == 'full'))
    runs-on: ubuntu-latest
    name: gateway admin UI / build and tests
    env:
      DSH_EVIDENCE_JOB_NAME: "gateway admin UI / build and tests"
      DSH_EVIDENCE_ARTIFACT_NAME: gate-evidence-gateway-admin-ui-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: npm
          cache-dependency-path: gateway/admin-ui/package-lock.json
      - name: Install Gateway admin UI dependencies
        run: npm ci --prefix gateway/admin-ui
      - uses: pnpm/action-setup@v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Install locked workspace sources for shared Admin components
        run: pnpm install --frozen-lockfile
      - name: Generate the two Admin Host Remote contributions
        run: npm run prepare:remotes --prefix gateway/admin-ui
      - name: Test Gateway admin UI
        run: npm test --prefix gateway/admin-ui
      - name: Build Gateway admin UI
        run: npm run build --prefix gateway/admin-ui
      - name: Preserve gate evidence
        if: always()
        uses: ./.github/actions/gate-evidence
        with:
          status: ${{ job.status }}
          external: admin-ui
          command: npm test and build --prefix gateway/admin-ui

  android-build:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'android-audit'
    runs-on: ubuntu-latest
    name: android / debug build and lint
    outputs:
      apk_artifact: android-debug-apks-${{ github.run_attempt }}
    timeout-minutes: 30
    env:
      DSH_EVIDENCE_JOB_NAME: "android / debug build and lint"
      DSH_EVIDENCE_ARTIFACT_NAME: gate-evidence-android-build-${{ github.run_attempt }}
      DSH_GATE_ARTIFACT_GLOBS: '["apps/android-shell/android/app/build/outputs/apk/debug/app-debug.apk", "apps/android-shell/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"]'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate notification registration and session navigation
        run: pnpm run test:android:protocol
      - name: Build ordinary debug and instrumentation APKs, lint and unit tests
        run: pnpm run check:android
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apks-${{ github.run_attempt }}
          path: apps/android-shell/android/app/build/outputs/apk/
          if-no-files-found: error
      - name: Preserve gate evidence
        if: always()
        uses: ./.github/actions/gate-evidence
        with:
          status: ${{ job.status }}
          external: android-build
          command: pnpm run check:android and test:android:protocol

  android-bridge:
    needs: android-build
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'android-audit'
    runs-on: ubuntu-latest
    name: android / native bridge
    timeout-minutes: 20
    env:
      DSH_EVIDENCE_JOB_NAME: "android / native bridge"
      DSH_EVIDENCE_ARTIFACT_NAME: gate-evidence-android-bridge-${{ github.run_attempt }}
      DSH_GATE_ARTIFACT_GLOBS: '[".artifacts/android/apk/debug/app-debug.apk", ".artifacts/android/apk/androidTest/debug/app-debug-androidTest.apk"]'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.android-build.outputs.apk_artifact }}
          path: .artifacts/android/apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          DSH_ANDROID_TEST_SERIAL: emulator-5554
        with:
          api-level: 36
          arch: x86_64
          script: node scripts/check-android.ts --connected
      - name: Preserve gate evidence
        if: always()
        uses: ./.github/actions/gate-evidence
        with:
          status: ${{ job.status }}
          external: android-bridge
          command: node scripts/check-android.ts --connected


  # Explicit full audit for a release candidate or a change whose impact is
  # uncertain. Pull requests use the scoped selector; this manual lane keeps a
  # complete Linux runtime, coverage, built-consumer, and browser rehearsal
  # available without making every PR pay its cost.
  full-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full-audit'
    runs-on: ubuntu-latest
    name: manual / full audit
    timeout-minutes: 120
    env:
      DSH_EVIDENCE_JOB_NAME: "manual / full audit"
      DSH_EVIDENCE_ARTIFACT_NAME: gate-evidence-full-audit-${{ github.run_attempt }}
      DSH_COVERAGE_MAX_WORKERS: '2'
      DSH_COVERAGE_PARTITIONS: '2'
      DSH_GATE_CONCURRENCY: '1'
      DSH_NODE_COMPAT_SKIP_TYPECHECK: '1'
      DSH_OXLINT_THREADS: '1'
      DSH_PUBLINT_CONCURRENCY: '1'
      DSH_SNAPSHOT_MAX_CONCURRENCY: '1'
      DSH_WEB_SNAPSHOT_WORKERS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Install dependencies and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"
      - name: Install Gateway runtime dependencies
        run: npm ci --prefix gateway
      - name: Install Admin browser dependencies
        run: npm ci --prefix gateway/admin-ui
      - name: Fetch pinned public upstream inputs
        run: node scripts/fetch-upstream-baseline.ts

      - name: Install Playwright Chromium and hosted dependencies
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium

      - name: Run full Linux audit
        run: pnpm run check:ci:linux-primary

      - name: Preserve gate evidence
        if: always()
        uses: ./.github/actions/gate-evidence
        with:
          status: ${{ job.status }}


  # The browser suite only ever ran on pull requests, and a red pull request is
  # still mergeable, so it rotted unnoticed: the workbench tree change broke
  # roughly fifteen e2e files on master and nothing surfaced it, because master
  # never re-ran this lane. This sweep replays the full consumer inventory after
  # the merge and nightly, so the suite cannot rot silently again. It mirrors
  # `node-24-consumers` but cannot depend on `pr-scope`, which is pull-request
  # only, so it always runs the complete inventory rather than a scoped one.
  web-snapshot-sweep:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
      || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    name: web browser snapshot sweep
    timeout-minutes: 90
    env:
      DSH_EVIDENCE_JOB_NAME: "web browser snapshot sweep"
      DSH_EVIDENCE_ARTIFACT_NAME: gate-evidence-web-snapshot-sweep-${{ github.run_attempt }}
      DSH_WEB_SNAPSHOT_WORKERS: '2'
      # Match the bounded PR consumer lane. The master sweep runs the same
      # build-backed inventory, so it must not re-enable nested typecheck/build
      # work or unbounded gate fan-out that races the live HMR browser owner.
      DSH_GATE_CONCURRENCY: '1'
      DSH_NODE_COMPAT_SKIP_TYPECHECK: '1'
      DSH_OXLINT_THREADS: '1'
      DSH_PUBLINT_CONCURRENCY: '1'
      DSH_SNAPSHOT_MAX_CONCURRENCY: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - uses: actions/cache/restore@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install (immutable)
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"

      # Gateway is an independent npm project outside the root pnpm workspace.
      # Root snapshot tests import its runtime modules.
      - name: Install Gateway runtime dependencies
        run: npm ci --prefix gateway
      - name: Install Admin browser dependencies
        run: npm ci --prefix gateway/admin-ui

      - name: Install Playwright Chromium and hosted dependencies
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium

      - name: Populate the PR browser cache from master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}

      # DSH_SNAPSHOT stays off the step environment: every consumer defaults to
      # replay, and exporting it here would leak the replay config swap
      # (cordis.yml -> cordis.snapshot.yml) into spawned built-bin children.
      - name: Run the consumer inventory with the browser snapshot
        run: pnpm run check:ci:consumers

      # Browser evidence lands in the gitignored .artifacts/; publish it only on
      # failure so a red sweep keeps its screenshots and DOM dumps.
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-sweep-failure-evidence
          path: .artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve gate evidence
        if: always()
        uses: ./.github/actions/gate-evidence
        with:
          status: ${{ job.status }}

  node-compat:
    needs: pr-scope
    # The compatibility smokes exercise runtime behaviour, so documentation-only
    # changes no longer pay for two extra full installs.
    if: >-
      always() && ((github.event_name == 'workflow_dispatch' && inputs.suite == 'full-audit')
      || (github.event_name == 'pull_request' && needs.pr-scope.outputs.compat_mode == 'full'))
    # Each compatibility contract receives an independent standard hosted job.
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}
    env:
      DSH_EVIDENCE_JOB_NAME: "${{ matrix.name }}"
      DSH_EVIDENCE_ARTIFACT_NAME: gate-evidence-node-compat-${{ strategy.job-index }}-${{ github.run_attempt }}
      DSH_GATE_CONCURRENCY: ${{ matrix.gate_concurrency }}
      DSH_NODE_COMPAT_SKIP_TYPECHECK: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22.19'
            name: node 22.19
            runner: ubuntu-latest
            gate_concurrency: '1'
          - node: 26
            name: node 26
            runner: ubuntu-latest
            gate_concurrency: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Prepare sandbox for source workflow smokes
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Run compatibility smokes
        env:
          DSH_BUILD_CLIENT_PROFILE: coharness
        run: pnpm run check:node-compat
      - name: Preserve gate evidence
        if: always()
        uses: ./.github/actions/gate-evidence
        with:
          status: ${{ job.status }}

  python-sdk:
    needs: pr-scope
    # The keyless Python suite only exercises `python/**`, so it follows the Python
    # surface rather than running on every pull request.
    if: >-
      always() && ((github.event_name == 'workflow_dispatch' && inputs.suite == 'full-audit')
      || (github.event_name == 'pull_request' && needs.pr-scope.outputs.python_mode == 'full'))
    runs-on: ubuntu-latest
    name: python 3.10 / keyless SDK
    env:
      DSH_EVIDENCE_JOB_NAME: "python 3.10 / keyless SDK"
      DSH_EVIDENCE_ARTIFACT_NAME: gate-evidence-python-sdk-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'
          cache: pip

      - name: Install uv
        run: python -m pip install uv==0.11.23

      - name: Check Python static errors
        run: uv run --locked --project python/sdk --group quality ruff check --config python/sdk/pyproject.toml python/sdk/src python/sdk-runtime/src scripts

      - name: Run complete keyless Python suite
        run: uv run --python 3.10 --group test --project python/sdk pytest
      - name: Preserve gate evidence
        if: always()
        uses: ./.github/actions/gate-evidence
        with:
          status: ${{ job.status }}
          external: python-sdk
          command: Ruff and pytest in python/sdk


  # The two pull-request targets exercise the complete release-shaped Python
  # path on both POSIX and native Windows without duplicating
  # platform-independent behavior across the release matrix. The reusable
  # builder owns the executable, snapshot, wheel, clean-install, GLIBC, and
  # manylinux checks; release validation retains all native targets.
  python-runtime:
    needs: pr-scope
    # The Python lanes build and exercise `python/**` plus the packaged runtime,
    # so they follow the Python surface rather than the coverage decision.
    if: >-
      always() && ((github.event_name == 'workflow_dispatch' && inputs.suite == 'full-audit')
      || (github.event_name == 'pull_request' && needs.pr-scope.outputs.python_mode == 'full'))
    name: python runtime / release-shaped matrix
    uses: ./.github/workflows/build-exe-for-python-sdk.yml
    with:
      targets: node24-linux-x64,node24-win-x64
      ci: true

  # The required pull-request Windows signal: the two blocking win32 surfaces
  # (workspace build, production site) execute with real, checksum-verified
  # Windows Node under Wine on standard hosted Linux. The independent
  # windows-native job below keeps the complete native-kernel inventory —
  # including the observational portability gates this lane does not run —
  # on real Windows. This job only provisions runner state (caches,
  # apt); scripts/wine-windows-gates.sh owns the gate logic and is the same
  # script the optional local gate `pnpm run check:windows-wine` runs.
  # Current topology and fidelity limits live in
  # .agents/notes/implemented/process/2026-08-08-native-windows-pull-request-ci.md
  windows:
    needs: pr-scope
    # Windows coverage is a platform matrix, not a coverage concern: it follows the
    # Windows surface so documentation and Python-only changes stop paying for it.
    if: github.event_name == 'pull_request' && needs.pr-scope.outputs.windows_mode == 'full'
    runs-on: ubuntu-latest
    name: windows node 24 / wine blocking
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      # Master's wine-apt-cache job seeds the default-branch scope every pull
      # request can read; a save from this job only reaches reruns of the
      # same merge ref.
      - name: Compose Wine apt cache key
        id: wine-cache-key
        run: echo "key=wine-debs-${ImageOS:-linux}-${ImageVersion:-v0}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/wine-debs
          key: ${{ steps.wine-cache-key.outputs.key }}

      # Runner provisioning only — a developer machine installs Wine through
      # its own package manager; the gate script assumes a wine binary and
      # fails loud without one. Wine from the apt cache when present; else
      # download the full dependency closure once and keep it for the next
      # run. The `wine` dispatcher package (not bare `wine64`) is what puts a
      # binary on PATH.
      - name: Install Wine
        run: |
          if compgen -G "$HOME/wine-debs/*.deb" > /dev/null; then
            # The restored archive is the full --download-only closure of
            # `wine` for this runner image, so installing the .debs directly
            # with dpkg needs no repository access. apt-get would instead
            # re-download the same 100+ MB closure from the mirror, which has
            # stalled the job past its budget on a degraded runner network.
            # If the archive cannot satisfy the closure, fall back to the apt
            # network install.
            if ! sudo DEBIAN_FRONTEND=noninteractive dpkg -i "$HOME"/wine-debs/*.deb; then
              sudo DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true
              sudo apt-get install -y --no-install-recommends "$HOME"/wine-debs/*.deb
            fi
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends --download-only wine
            mkdir -p "$HOME/wine-debs"
            cp /var/cache/apt/archives/*.deb "$HOME/wine-debs/" 2>/dev/null || true
            sudo apt-get install -y --no-install-recommends wine
          fi

      - name: Run the Wine Windows gates
        run: bash scripts/wine-windows-gates.sh

      - name: Shut down wineserver
        if: always()
        run: wineserver -k 2>/dev/null || true

  # Master seeds the Wine apt-archive cache in the default-branch scope,
  # which every pull request's windows job can restore; saves from
  # pull-request runs are scoped to their own merge ref and help nobody
  # else. Runs in seconds when the image version already has a cache.
  wine-apt-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: wine apt cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compose Wine apt cache key
        id: wine-cache-key
        run: echo "key=wine-debs-${ImageOS:-linux}-${ImageVersion:-v0}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: wine-cache
        with:
          path: ~/wine-debs
          key: ${{ steps.wine-cache-key.outputs.key }}

      - name: Download the Wine dependency closure
        if: steps.wine-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --download-only wine
          mkdir -p "$HOME/wine-debs"
          cp /var/cache/apt/archives/*.deb "$HOME/wine-debs/"
          du -sh "$HOME/wine-debs"

  # Native Windows proves selected kernel/process changes before merge and
  # preserves the exhaustive master/nightly sweep for unrelated changes.
  # The portable default is windows-2025. A deployment with the named
  # larger pool may set DSH_CI_ENTERPRISE_RUNNERS_ENABLED=true; Windows failover
  # (DSH_CI_FAILOVER_WINDOWS=selfhosted) takes priority and retargets onto the
  # in-house self-hosted Windows pool. Fork and Dependabot PRs are excluded
  # from the self-hosted pool and stay on hosted capacity — see the failover
  # runbook. A push or schedule event carries no pull_request payload, so those
  # runs take the hosted or enterprise pool instead of the self-hosted one.
  # This Windows switch is independent of the Linux
  # DSH_CI_FAILOVER_LINUX variable that retargets the three required Linux jobs
  # and the all-checks-passed verdict above.
  windows-native:
    needs: pr-scope
    if: >-
      always() && ((github.event_name == 'push' && github.ref == 'refs/heads/master')
      || github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full-audit')
      || (github.event_name == 'pull_request' && needs.pr-scope.outputs.proof_native_windows == 'true'))
    runs-on: >-
      ${{ vars.DSH_CI_FAILOVER_WINDOWS == 'selfhosted'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && fromJSON('["self-hosted", "dsh-win-ci", "windows"]')
          || vars.DSH_CI_ENTERPRISE_RUNNERS_ENABLED == 'true'
          && 'dsh-windows-2025-16core'
          || 'windows-2025' }}
    name: windows node 24 / native complete
    timeout-minutes: 120
    env:
      DSH_EVIDENCE_JOB_NAME: "windows node 24 / native complete"
      DSH_EVIDENCE_ARTIFACT_NAME: gate-evidence-windows-native-${{ github.run_attempt }}
      DSH_COVERAGE_MAX_WORKERS: >-
        ${{ ((vars.DSH_CI_FAILOVER_WINDOWS == 'selfhosted'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]')
          || vars.DSH_CI_ENTERPRISE_RUNNERS_ENABLED == 'true')
          && '6' || '2' }}
      DSH_COVERAGE_PARTITIONS: >-
        ${{ ((vars.DSH_CI_FAILOVER_WINDOWS == 'selfhosted'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]')
          || vars.DSH_CI_ENTERPRISE_RUNNERS_ENABLED == 'true')
          && '8' || '2' }}
      # Instrumented process and polling fixtures can exceed Vitest's defaults
      # under the complete lane's partition fan-out and build-backed workload.
      DSH_COVERAGE_TEST_TIMEOUT_MS: '30000'
      DSH_GATE_CONCURRENCY: >-
        ${{ ((vars.DSH_CI_FAILOVER_WINDOWS == 'selfhosted'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]')
          || vars.DSH_CI_ENTERPRISE_RUNNERS_ENABLED == 'true')
          && '4' || '1' }}
      DSH_PUBLINT_CONCURRENCY: >-
        ${{ ((vars.DSH_CI_FAILOVER_WINDOWS == 'selfhosted'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]')
          || vars.DSH_CI_ENTERPRISE_RUNNERS_ENABLED == 'true')
          && '8' || '1' }}
    steps:
      # Fetch complete history so the upstream sovereignty gate can diff mirrored release tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable Developer Mode (symlink support)
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: pnpm/action-setup@v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      # Extracting the many-file pnpm store cache is slower than a clean
      # install on hosted Windows runners, and saving it adds latency after
      # the gates. The self-hosted VM's persistent store makes caching
      # redundant.
      - name: Install (immutable)
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Run complete native Windows gate inventory
        shell: pwsh
        run: pnpm run check:ci:windows-complete
      - name: Preserve gate evidence
        if: always()
        uses: ./.github/actions/gate-evidence
        with:
          status: ${{ job.status }}


  # Optional hot-standby drill for the in-house self-hosted pool. When
  # DSH_CI_SELF_HOSTED_STANDBY_ENABLED is exactly `true`, each master move
  # re-runs the complete unsharded aggregate on the persistent 64-core VM and
  # proves that environment can take over through DSH_CI_FAILOVER_LINUX. The
  # push-triggered lane executes the base branch's workflow definition. Under
  # failover, pull_request jobs instead reach the pool with the PR merge ref's
  # workflow; Dependabot remains excluded. The drill is non-blocking for pull
  # requests and uses the VM's persistent tool caches.
  serial-linux-selfhosted:
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/master'
      && vars.DSH_CI_SELF_HOSTED_STANDBY_ENABLED == 'true'
    name: serial / linux (self-hosted standby)
    runs-on: [self-hosted, linux, x64, vm-backup]
    steps:
      # DSH_ARCHIVE_BASE_REF below compares the frozen-archive gate against
      # github.event.before, so full history is required: depth 2 would miss it
      # on multi-commit or force pushes; full fetch is cheap here because
      # checkout resolves against the VM's local mirror.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure persistent pnpm store
        run: echo "PNPM_CONFIG_STORE_DIR=$HOME/.local/share/pnpm/store" >> "$GITHUB_ENV"

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The persistent VM image owns Playwright's Linux system packages; this
      # step also proves that browser provisioning remains usable for failover.
      - name: Install Playwright Chromium
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install chromium

      - name: Prepare bubblewrap (unrestrict userns)
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Run complete unsharded primary Node CI serially
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.before }}
          DSH_COVERAGE_MAX_WORKERS: '1'
          DSH_E2E_MAX_WORKERS: '1'
          DSH_GATE_CONCURRENCY: '1'
          DSH_OXLINT_THREADS: '1'
          DSH_PUBLINT_CONCURRENCY: '1'
          DSH_SNAPSHOT_MAX_CONCURRENCY: '1'
        run: pnpm run check:ci:linux-primary

  # The one remaining disabled hosted serial reference job; see
  # TODO(hosted-serial-ci) above.
  serial-macos:
    if: false
    name: serial / macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run complete unsharded primary Node CI serially
        env:
          DSH_COVERAGE_MAX_WORKERS: '1'
          DSH_E2E_MAX_WORKERS: '1'
          DSH_GATE_CONCURRENCY: '1'
          DSH_PUBLINT_CONCURRENCY: '1'
          DSH_SNAPSHOT_MAX_CONCURRENCY: '1'
        run: pnpm run check:ci

  # Optional hot-standby drill for the in-house self-hosted Windows pool. When
  # DSH_CI_SELF_HOSTED_STANDBY_ENABLED is exactly `true`, each master move runs
  # the complete unsharded Windows inventory and proves the
  # DSH_CI_FAILOVER_WINDOWS target. It is non-blocking for pull requests and is
  # absent from all-checks-passed.needs; the VM's persistent pnpm store and tool
  # caches avoid transferring hosted cache archives.
  serial-windows:
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/master'
      && vars.DSH_CI_SELF_HOSTED_STANDBY_ENABLED == 'true'
    name: serial / windows (self-hosted standby)
    runs-on: [self-hosted, dsh-win-ci, windows]
    timeout-minutes: 120
    steps:
      # Fetch complete history so the upstream sovereignty gate can diff mirrored release tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable Developer Mode (symlink support)
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: pnpm/action-setup@v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure persistent pnpm store
        shell: pwsh
        run: |
          $storeRoot = "$env:LOCALAPPDATA\pnpm\store"
          echo "PNPM_CONFIG_STORE_DIR=$storeRoot" >> $env:GITHUB_ENV

      - name: Install (immutable)
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Run complete unsharded Windows gate inventory serially
        shell: pwsh
        env:
          DSH_COVERAGE_MAX_WORKERS: '1'
          DSH_GATE_CONCURRENCY: '1'
          DSH_PUBLINT_CONCURRENCY: '1'
        run: pnpm run check:ci:windows-complete

  # Manual, bounded comparison of the actual critical Linux and Windows lanes.
  # The named pools are restricted at the organization level to this repository.
  larger-runner-benchmark:
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.suite == 'larger-runner-benchmark'
      && vars.DSH_CI_ENTERPRISE_RUNNERS_ENABLED == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - platform: linux
            cores: '4'
            runner: dsh-ubuntu-24-04-4core
            workload: typecheck
          - platform: linux
            cores: '8'
            runner: dsh-ubuntu-24-04-8core
            workload: typecheck
          - platform: linux
            cores: '16'
            runner: dsh-ubuntu-24-04-16core
            workload: typecheck
          - platform: linux
            cores: '32'
            runner: dsh-ubuntu-24-04-32core
            workload: typecheck
          - platform: linux
            cores: '64'
            runner: dsh-ubuntu-24-04-64core
            workload: typecheck
          - platform: linux
            cores: '96'
            runner: dsh-ubuntu-24-04-96core
            workload: typecheck
          - platform: windows
            cores: '4'
            runner: dsh-windows-2025-4core
            workload: production-site
          - platform: windows
            cores: '8'
            runner: dsh-windows-2025-8core
            workload: production-site
          - platform: windows
            cores: '16'
            runner: dsh-windows-2025-16core
            workload: production-site
          - platform: windows
            cores: '32'
            runner: dsh-windows-2025-32core
            workload: production-site
          - platform: windows
            cores: '64'
            runner: dsh-windows-2025-64core
            workload: production-site
          - platform: windows
            cores: '96'
            runner: dsh-windows-2025-96core
            workload: production-site
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      # The benchmark's Windows lanes deliberately skip the store cache like
      # the independent native Windows job; an empty input disables caching.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: ${{ matrix.platform == 'linux' && 'pnpm' || '' }}

      - name: Report runner capacity
        run: >-
          node -e "const os = require('node:os');
          console.log(JSON.stringify({ arch: process.arch, cpus: os.cpus().length,
          memoryGiB: Math.round(os.totalmem() / 2 ** 30) }))"

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run critical Linux typecheck lane
        if: matrix.platform == 'linux'
        run: pnpm run typecheck

      - name: Run critical Windows production-site lane
        if: matrix.platform == 'windows'
        run: pnpm run docs:build

  # Manual comparison of the intended low-fanout topology. Linux runs the
  # complete unsharded primary aggregate with bounded in-runner parallelism;
  # Windows runs both blocking build targets concurrently through run-gates.
  consolidated-runner-benchmark:
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.suite == 'consolidated-runner-benchmark'
      && vars.DSH_CI_ENTERPRISE_RUNNERS_ENABLED == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - platform: linux
            cores: '4'
            runner: dsh-ubuntu-24-04-4core
            workers: '4'
          - platform: linux
            cores: '8'
            runner: dsh-ubuntu-24-04-8core
            workers: '8'
          - platform: linux
            cores: '16'
            runner: dsh-ubuntu-24-04-16core
            workers: '16'
          - platform: linux
            cores: '32'
            runner: dsh-ubuntu-24-04-32core
            workers: '32'
          - platform: linux
            cores: '64'
            runner: dsh-ubuntu-24-04-64core
            workers: '32'
          - platform: linux
            cores: '96'
            runner: dsh-ubuntu-24-04-96core
            workers: '32'
          - platform: windows
            cores: '4'
            runner: dsh-windows-2025-4core
            workers: '2'
          - platform: windows
            cores: '8'
            runner: dsh-windows-2025-8core
            workers: '2'
          - platform: windows
            cores: '16'
            runner: dsh-windows-2025-16core
            workers: '2'
          - platform: windows
            cores: '32'
            runner: dsh-windows-2025-32core
            workers: '2'
          - platform: windows
            cores: '64'
            runner: dsh-windows-2025-64core
            workers: '2'
          - platform: windows
            cores: '96'
            runner: dsh-windows-2025-96core
            workers: '2'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      # Unlike the larger-runner suite, both platforms cache the store here:
      # the consolidated topology measures cache mechanics as workload.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Report runner capacity
        run: >-
          node -e "const os = require('node:os');
          console.log(JSON.stringify({ arch: process.arch, cpus: os.cpus().length,
          memoryGiB: Math.round(os.totalmem() / 2 ** 30) }))"

      - name: Install and prepare Linux
        if: matrix.platform == 'linux'
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"

      - name: Install (immutable)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Run complete unsharded primary Node CI concurrently
        if: matrix.platform == 'linux'
        env:
          DSH_COVERAGE_MAX_WORKERS: ${{ matrix.workers }}
          DSH_GATE_CONCURRENCY: ${{ matrix.workers }}
          DSH_OXLINT_THREADS: ${{ matrix.workers }}
          DSH_PUBLINT_CONCURRENCY: ${{ matrix.workers }}
          DSH_SNAPSHOT_MAX_CONCURRENCY: ${{ matrix.workers }}
        run: pnpm run check:ci

      - name: Run blocking Windows builds concurrently
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          DSH_GATE_CONCURRENCY: ${{ matrix.workers }}
        run: pnpm run check:ci:windows-blocking

  release-pack:
    needs: pr-scope
    if: github.event_name == 'pull_request' && needs.pr-scope.outputs.proof_release_pack == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      required_proof: true

  vendor-pack:
    needs: pr-scope
    if: github.event_name == 'pull_request' && needs.pr-scope.outputs.proof_vendor_pack == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-vendor.yml
    with:
      required_proof: true

  native-pack:
    needs: pr-scope
    if: github.event_name == 'pull_request' && needs.pr-scope.outputs.proof_native_pack == 'true'
    uses: ./.github/workflows/landlock-run.yml
    with:
      required_proof: true

  sandbox-proof:
    needs: pr-scope
    if: github.event_name == 'pull_request' && needs.pr-scope.outputs.proof_sandbox == 'true'
    uses: ./.github/workflows/sandbox.yml
    with:
      required_proof: true

  provider-proof:
    needs: pr-scope
    if: github.event_name == 'pull_request' && needs.pr-scope.outputs.proof_provider == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      required_proof: true
    secrets: inherit

  pi-ai-proof:
    needs: pr-scope
    if: github.event_name == 'pull_request' && needs.pr-scope.outputs.proof_pi_ai == 'true'
    uses: ./.github/workflows/pi-ai-provider-e2e.yml
    with:
      required_proof: true
    secrets: inherit

  # Required proof jobs and this verdict consume the same candidate-bound plan.
  # Always run the verdict: a selected job skipped after a failure is not proof.
  all-checks-passed:
    name: all checks passed
    # This bookkeeping-only verdict must not depend on custom-pool
    # provisioning — and under Linux failover it follows the same selector as
    # the worker jobs it aggregates, so a standard-hosted outage cannot strand
    # the branch-protection verdict either. It retargets with the Linux switch
    # (DSH_CI_FAILOVER_LINUX), not the Windows one, because it aggregates the
    # required Linux workers and runs on the vm-backup pool.
    runs-on: >-
      ${{ vars.DSH_CI_FAILOVER_LINUX == 'selfhosted'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && fromJSON('["self-hosted", "linux", "x64", "vm-backup"]')
          || 'ubuntu-latest' }}
    needs: [pr-scope, node-24, node-24-coverage, node-24-bench, node-24-consumers, web-verification, node-compat, python-sdk, python-runtime, windows, gateway, gateway-admin-ui, windows-native, release-pack, vendor-pack, native-pack, sandbox-proof, provider-proof, pi-ai-proof]
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Require current-candidate evidence
        env:
          DSH_PR_VALIDATION_PLAN: ${{ needs.pr-scope.outputs.validation_plan }}
          DSH_CI_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/verify-pr-results.ts
