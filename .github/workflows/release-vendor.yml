# Pack and publish the vendored framework sequence: the nine rescoped Cordis
# packages under vendor/, each on its own version line. This sequence releases
# independently of dsh and of the native packages.
#
# Pack runs without credentials on every pull request and master push.
# Publication is a manual dispatch from a vendor-* tag; a vendor release can
# carry several versions, so each package has its own tag.
name: Release (vendor)

on:
  pull_request:
    paths:
      - 'vendor/**'
      - 'scripts/release/**'
      - 'scripts/rescope-vendor.ts'
      - '.github/workflows/release-vendor.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
  push:
    branches: [master]
    paths:
      - 'vendor/**'
      - 'scripts/release/**'
      - 'scripts/rescope-vendor.ts'
      - '.github/workflows/release-vendor.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
  workflow_dispatch:
    inputs:
      evidence_runs:
        description: Comma-separated completed CI run IDs for this exact candidate. Required to publish.
        required: false
        type: string
      publish:
        description: Publish the packed tarballs to npm. Must run from a vendor-* tag.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  # A newer commit supersedes an in-flight pull-request pack. Pushes and manual
  # publication runs remain serialized and are never cancelled.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DSH_RELEASE_READINESS: .artifacts/release-evidence/readiness.json
  DSH_RELEASE_EVIDENCE_RUNS: ${{ inputs.evidence_runs }}
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  pack:
    name: Pack npm tarballs
    runs-on: ubuntu-24.04
    steps:
      # Complete history: the release scripts read tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Assemble and verify source readiness
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm run release:prepare --family vendor

      - name: Verify vendored resolution
        run: pnpm run verify-vendored-links

      - name: Verify release version
        env:
          RELEASE_PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ inputs.publish && github.token || '' }}
        run: pnpm run release:verify --family vendor

      # The vendored packages publish their own sources and build outputs; the
      # host build produces what their manifests select.
      - name: Build
        run: pnpm run build:lib:host

      - name: Pack release tarballs
        run: pnpm run release:pack --family vendor --out dist/npm-vendor

      - name: Verify packed install
        run: pnpm run release:verify-packed-install --family vendor --from dist/npm-vendor

      - name: Record tested packed bytes
        uses: ./.github/actions/gate-evidence
        env:
          DSH_GATE_REPORT_DIR: .artifacts/gates
          DSH_EVIDENCE_ARTIFACT_NAME: gate-evidence-vendor-pack-${{ github.run_attempt }}
          DSH_EVIDENCE_JOB_NAME: Pack npm tarballs
          DSH_BUILD_CLIENT_PROFILE: official
          DSH_GATE_ARTIFACT_GLOBS: '["dist/npm-vendor/*.tgz"]'
        with:
          external: npm-pack
          status: ${{ job.status }}
          command: pnpm run release:verify-packed-install --family vendor

      - uses: actions/upload-artifact@v7
        with:
          name: vendor-npm-tarballs
          path: dist/npm-vendor/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    if: inputs.publish
    needs: pack
    runs-on: ubuntu-24.04
    environment: npm-publish
    concurrency:
      group: Release-publish
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      # Checkout and install carry the release scripts only; no build step.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install (immutable, no package scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@v8
        with:
          name: vendor-npm-tarballs
          path: dist/npm-vendor

      - name: Verify source and the tested publication artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm run release:prepare --family vendor --phase publish

      - name: Publish tarballs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm run release:publish --family vendor --from dist/npm-vendor
