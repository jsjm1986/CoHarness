name: E2E (pi-ai Azure OpenAI and Anthropic)

# This suite spends tokens against two external providers and is intentionally
# selected by CI or explicitly dispatched. It has no independent PR or nightly trigger.
on:
  workflow_call:
    inputs:
      required_proof:
        description: Require both selected external provider protocols to succeed.
        type: boolean
        default: false
      azure_openai_model:
        type: string
        default: gpt-5.5
      anthropic_model:
        type: string
        default: claude-opus-4-8
    secrets:
      AZURE_OPENAI_API_KEY_EXTERNAL:
        required: false
      ANTHROPIC_API_KEY_EXTERNAL:
        required: false
  workflow_dispatch:
    inputs:
      azure_openai_model:
        description: Azure OpenAI model from pi-ai's installed catalog
        required: true
        default: gpt-5.5
        type: string
      anthropic_model:
        description: Anthropic model from pi-ai's installed catalog
        required: true
        default: claude-opus-4-8
        type: string

permissions:
  contents: read

concurrency:
  group: pi-ai-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  e2e:
    if: >-
      github.repository == 'jsjm1986/CoHarness'
      && (github.event_name != 'pull_request'
      || !(github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]'))
    runs-on: ubuntu-latest
    name: Azure OpenAI Responses + Anthropic Messages
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The tests self-skip locally when a credential is absent. A manually
      # dispatched CI run must fail instead of reporting an all-skipped green.
      - name: Preflight (require provider API keys)
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY_EXTERNAL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_EXTERNAL }}
        run: |
          set -euo pipefail
          missing=0
          for name in AZURE_OPENAI_API_KEY ANTHROPIC_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is empty. Configure the corresponding *_EXTERNAL repository secret."
              missing=1
            fi
          done
          exit "$missing"

      - name: E2E tests (real Azure OpenAI and Anthropic APIs)
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY_EXTERNAL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_EXTERNAL }}
          DSH_PI_AI_OPENAI_MODEL: ${{ inputs.azure_openai_model }}
          DSH_PI_AI_OPENAI_BASE_URL: https://openai-routerhub-resource.services.ai.azure.com/api/projects/openai/openai/v1
          DSH_PI_AI_ANTHROPIC_MODEL: ${{ inputs.anthropic_model }}
          DSH_E2E_MAX_WORKERS: 2
        run: >-
          pnpm exec vitest run --config vitest.e2e.config.ts
          packages/llm/llm-pi-ai/tests/provider-apis.e2e.ts
          --reporter=default --reporter=json --outputFile=.artifacts/provider-results.json

      - name: Preserve both real-provider protocols
        if: always()
        uses: ./.github/actions/gate-evidence
        env:
          DSH_GATE_REPORT_DIR: .artifacts/gates
          DSH_EVIDENCE_ARTIFACT_NAME: gate-evidence-real-provider-pi-ai-${{ github.run_attempt }}
          DSH_EVIDENCE_JOB_NAME: Azure OpenAI Responses + Anthropic Messages
          DSH_PROVIDER_TEST_RESULTS: .artifacts/provider-results.json
        with:
          external: real-provider-pi-ai
          status: ${{ job.status }}
          command: real OpenAI Responses and Anthropic Messages tests

  proof-status:
    name: Required pi-ai proof
    needs: e2e
    if: always() && inputs.required_proof
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Reject unavailable or unsuccessful provider protocols
        if: needs.e2e.result != 'success'
        run: |
          echo '::error::The required OpenAI and Anthropic proof did not succeed. Missing credentials or an untrusted event cannot satisfy it.'
          exit 1
