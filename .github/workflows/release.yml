# Pack and publish the dsh release sequence: every package under packages/ plus
# the apps/ entries, all on one version. The vendored framework and the native
# packages are separate sequences with their own workflows and version lines.
#
# Pack runs without credentials on every pull request and master push, so a
# pull request proves the whole publish set still packs. Publication is a
# manual dispatch from a dsh-v* tag and consumes exactly the packed bytes.
name: Release (dsh)

on:
  workflow_call:
    inputs:
      required_proof:
        description: Verify packed installation only; this interface cannot publish.
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'plugins/**'
      - 'vendor/**'
      - 'native/system/**'
      - 'python/**'
      - 'scripts/build-*.ts'
      - 'scripts/release/**'
      - 'scripts/publication-payload*'
      - '.github/workflows/release.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
  workflow_dispatch:
    inputs:
      evidence_runs:
        description: Comma-separated completed CI run IDs for this exact candidate. Required to publish.
        required: false
        type: string
      publish:
        description: Publish the packed tarballs to npm. Must run from a dsh-v* tag.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  # A newer commit supersedes an in-flight pull-request pack. Pushes and manual
  # publication runs remain serialized and are never cancelled.
  group: release-dsh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DSH_RELEASE_READINESS: .artifacts/release-evidence/readiness.json
  DSH_RELEASE_EVIDENCE_RUNS: ${{ inputs.evidence_runs }}
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  pack:
    name: Pack npm tarballs
    runs-on: ubuntu-24.04
    steps:
      # Complete history: the release scripts read tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: pnpm-cache
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Populate the PR dependency cache from master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      - name: Assemble and verify source readiness
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm run release:prepare --family dsh

      - name: Verify vendored resolution
        run: pnpm run verify-vendored-links

      - name: Verify release version
        env:
          RELEASE_PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ inputs.publish && github.token || '' }}
        run: pnpm run release:verify --family dsh

      - name: Verify package dependency ownership
        run: pnpm run verify-package-dependencies

      - name: Verify dual-version npm layout
        run: pnpm run verify-npm-install-layout

      - name: Build
        run: pnpm run build:coharness

      - name: Pack release tarballs
        run: pnpm run release:pack --family dsh --out dist/npm

      # The harness packages declare the vendored framework as a peer, and this
      # verification must not depend on the registry already carrying matching
      # versions — one pull request may bump both families before either
      # publishes — so it installs that family's pack output too. Only dist/npm
      # is published.
      - name: Pack the vendored framework for verification
        run: pnpm run release:pack --family vendor --out dist/npm-vendor

      # dsh-sandbox-local declares the Landlock entry as a runtime dependency, so
      # the verification needs its tarball. Its platform packages stay out: they
      # are optional, and building them needs a musl toolchain per architecture.
      - name: Pack the Landlock entry for verification
        run: |
          pnpm --dir native/system run build:ts
          pnpm --dir native/system/packages/entry pack --pack-destination "$PWD/dist/npm-landlock"

      - name: Verify packed install
        run: pnpm run release:verify-packed-install --family dsh --from dist/npm --from dist/npm-vendor --from dist/npm-landlock

      - name: Record tested packed bytes
        uses: ./.github/actions/gate-evidence
        env:
          DSH_GATE_REPORT_DIR: .artifacts/gates
          DSH_EVIDENCE_ARTIFACT_NAME: gate-evidence-dsh-pack-${{ github.run_attempt }}
          DSH_EVIDENCE_JOB_NAME: Pack npm tarballs
          DSH_BUILD_CLIENT_PROFILE: coharness
          DSH_GATE_ARTIFACT_GLOBS: '["dist/npm/*.tgz"]'
        with:
          external: npm-pack
          status: ${{ job.status }}
          command: pnpm run release:verify-packed-install --family dsh

      - uses: actions/upload-artifact@v7
        with:
          name: dsh-npm-tarballs
          path: dist/npm/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    if: github.event_name == 'workflow_dispatch' && inputs.publish && !inputs.required_proof
    needs: pack
    runs-on: ubuntu-24.04
    # Required reviewers and the allowed tags live on the environment; this is
    # the only step in the sequence that can write to the registry.
    environment: npm-publish
    concurrency:
      group: Release-publish
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      # Checkout and install carry the release scripts only. There is no build
      # step: publication uploads the bytes the pack job produced.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install (immutable, no package scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@v8
        with:
          name: dsh-npm-tarballs
          path: dist/npm

      - name: Verify source and the tested publication artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm run release:prepare --family dsh --phase publish

      - name: Publish tarballs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm run release:publish --family dsh --from dist/npm
