version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    exclude-paths:
      # Vendored Cordis sources follow vendor/README.md instead of registry updates.
      - "vendor/**"
    ignore:
      # The pnpm npm package ships inside the Python runtime payload and build/test
      # consumers invoke its JavaScript entrypoint; majors need a dedicated
      # migration (Agent Note: pnpm-is-a-bundled-runtime-component).
      - dependency-name: "pnpm"
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react 6+ requires vite ^8; majors ride the web app's
      # vite migration, not standalone bumps.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # Test helpers share Vitest's mock types and coverage protocol.
      # Major migrations update the complete family and its consumers together.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      bundled-pnpm:
        patterns:
          - "pnpm"
    open-pull-requests-limit: 2
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"

  - package-ecosystem: "uv"
    directory: "/python/sdk"
    open-pull-requests-limit: 1
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"

  - package-ecosystem: "github-actions"
    directory: "/"
    ignore:
      # Held pending macOS Intel bootstrap verification (#254).
      # A replacement must pass the selected installation and packaging proofs.
      - dependency-name: "pnpm/action-setup"
        versions: ["6.1.0"]
    open-pull-requests-limit: 1
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"
