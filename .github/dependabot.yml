version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    exclude-paths:
      # Vendored Cordis sources follow vendor/README.md instead of registry updates.
      - "vendor/**"
    ignore:
      # The pnpm npm package ships inside the Python runtime payload and build/test
      # consumers invoke its JavaScript entrypoint; majors need a dedicated
      # migration (Agent Note: pnpm-is-a-bundled-runtime-component).
      - dependency-name: "pnpm"
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react 6+ requires vite ^8; majors ride the web app's
      # vite migration, not standalone bumps.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"

  - package-ecosystem: "uv"
    directory: "/python/sdk"
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"
